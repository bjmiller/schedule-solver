[project]
name = "scheduler"
version = "0.1.0"
description = "Sports league schedule solver using CP-SAT"
requires-python = ">=3.14"
dependencies = [
    "ortools>=9.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a5",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[project.scripts]
scheduler = "scheduler.cli:main"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "PTH", # use pathlib
]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
